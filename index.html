function makeQuiz(topic){let pool=topicBanks[topic]||topicBanks[0];let picked=[...pool].sort(()=>Math.random()-.5).slice(0,10);return picked.map(q=>{let opts=q[1].map((x,j)=>({text:x,ok:j===q[2]})).sort(()=>Math.random()-.5);return {text:q[0],opts}})}function startQuiz(topic){quiz={topic,at:0,score:0,qs:makeQuiz(topic),locked:false};go('quiz');showQ()}function showQ(){let q=quiz.qs[quiz.at];qtitle.textContent=`${topics[quiz.topic]}　${quiz.at+1}/10`;qbar.style.width=`${(quiz.at+1)*10}%`;qtext.textContent=q.text;answers.innerHTML=q.opts.map((o,i)=>`<button class="answer" data-answer="${i}">${String.fromCharCode(65+i)}　${o.text}</button>`).join('');feedback.textContent='';nextQ.classList.add('hidden');quiz.locked=false}function answer(i){if(quiz.locked)return;quiz.locked=true;let q=quiz.qs[quiz.at],ok=q.opts[i].ok;if(ok)quiz.score++;[...answers.children].forEach((b,k)=>{if(q.opts[k].ok)b.classList.add('good');else if(k===i)b.classList.add('bad')});feedback.textContent=ok?'答對了 ✓':'正確答案已標示。';nextQ.classList.remove('hidden')}function finish(){let ok=quiz.score>=7,p=S.progress[quiz.topic]||{star:1,clears:0};if(ok){S.coins+=50;p.clears++;if(p.clears>=6&&p.star<3){p.star++;p.clears=0;S.gems++}}S.progress[quiz.topic]=p;save();score.textContent=quiz.score+'/10';pass.textContent=ok?'通過 ✓':'再練一次';reward.textContent=ok?'獲得 50 金幣':'答對 7 題即可過關';go('result')}
const ward={hair:[['長波浪','wave'],['短髮','short'],['包頭','bun'],['鮑伯','bob']],color:[['奶茶棕','#70483c'],['莓果棕','#6c3943'],['蜂蜜金','#b9854d'],['霧粉棕','#9a6b72']],dress:[['櫻花洋裝','#f5a7c2'],['天空洋裝','#91c9e8'],['奶茶洋裝','#d7b18a'],['森林洋裝','#8db99b']],acc:[['側背包','bag'],['蝴蝶結','bow'],['無配件','none']]};function renderWard(){wtabs.innerHTML=[['hair','髮型'],['color','髮色'],['dress','服裝'],['acc','配件']].map(x=>`<button class="tab ${wtab===x[0]?'sel':''}" data-wtab="${x[0]}">${x[1]}</button>`).join('');wchoices.innerHTML=ward[wtab].map(x=>`<button class="choice" data-wval="${x[1]}">${x[0]}</button>`).join('');wardAvatar.innerHTML=avatarSVG()}
const icons={desk:'🖥️',sofa:'🛋️',lamp:'💡'};function addFurniture(type){S.room.push({type,x:110+S.room.length*20,y:210+S.room.length*15,s:1,flip:1});selected=S.room.length-1;save();renderRoom()}function renderRoom(){roomStage.innerHTML=S.room.map((f,i)=>`<div class="furn" data-fi="${i}" data-type="${f.type}" style="left:${f.x}px;top:${f.y}px;transform:scale(${f.flip*f.s},${f.s});outline:${i===selected?'3px dashed #f29bb7':'none'}">${icons[f.type]}</div>`).join('')}
function renderPet(){petDog.innerHTML=dogSVG();hunger.textContent=S.pet.hunger;hbar.style.width=S.pet.hunger+'%'}function petAct(a){if(a==='feed'&&S.coins>=10){S.coins-=10;S.pet.hunger=Math.min(100,S.pet.hunger+20);petmsg.textContent='吃飽了！'}if(a==='rest'){S.pet.hunger=Math.min(100,S.pet.hunger+5);petmsg.textContent='休息完成。'}if(a==='work'){S.coins+=20;S.pet.hunger=Math.max(0,S.pet.hunger-10);petmsg.textContent='工作完成，獲得 20 金幣。'}save();renderPet()}
const spellWords=[['蘋果','apple'],['學校','school'],['朋友','friend'],['早餐','breakfast'],['圖書館','library'],['老師','teacher'],['學生','student'],['家庭','family'],['星期一','monday'],['星期日','sunday'],['快樂的','happy'],['漂亮的','pretty'],['水','water'],['牛奶','milk'],['晚餐','dinner'],['房間','room'],['桌子','table'],['椅子','chair'],['鉛筆','pencil'],['橡皮擦','eraser']];let spellState={index:-1,last:-1,correct:0,total:0,answer:''};
function nextSpell(){let i;do{i=Math.floor(Math.random()*spellWords.length)}while(spellWords.length>1&&i===spellState.last);spellState.last=i;spellState.index=i;spellState.answer=spellWords[i][1];spellState.total++;let w=spellWords[i];gamebox.innerHTML=`<div class="card center"><h2>單字拼字</h2><p>第 ${spellState.total} 題　答對 ${spellState.correct} 題</p><h1>${w[0]}</h1><input id="spellInput" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="輸入英文單字"><br><br><button class="big" id="spellSubmit">送出</button><button class="big" id="spellHint">提示 -10 🪙</button><h3 id="gmsg"></h3><button class="big hidden" id="spellNext">下一題 ›</button></div>`;setTimeout(()=>document.getElementById('spellInput')?.focus(),50)}
function checkSpell(){let input=document.getElementById('spellInput'),msg=document.getElementById('gmsg'),next=document.getElementById('spellNext'),submit=document.getElementById('spellSubmit');if(!input||!input.value.trim()){msg.textContent='請先輸入答案';return}let ok=input.value.trim().toLowerCase()===spellState.answer.toLowerCase();if(ok){spellState.correct++;S.coins+=10;save();msg.textContent='答對了 ✓　+10 金幣'}else msg.textContent=`再試一次，或使用提示`;if(ok){input.disabled=true;submit.disabled=true;next.classList.remove('hidden')}else{next.classList.remove('hidden');next.textContent='換下一題 ›'}}
function spellHint(){if(S.coins<10){gmsg.textContent='金幣不足';return}S.coins-=10;save();let w=spellState.answer,i=Math.floor(Math.random()*w.length);gmsg.textContent=`提示：第 ${i+1} 個字母是 ${w[i].toUpperCase()}`}
function game(t){if(t==='wheel'){let used=localStorage.getItem('eq38wheel')===new Date().toDateString();gamebox.innerHTML=`<div class="card center"><h2>每日幸運轉盤</h2><div class="wheel" id="wheel"></div><p>20・40・60・80・100・20</p><button class="big" id="spin" ${used?'disabled':''}>${used?'今天已抽過':'開始轉動'}</button><h3 id="gmsg"></h3></div>`}else if(t==='spell'){spellState={index:-1,last:spellState.last,correct:0,total:0,answer:''};nextSpell()}else{gamebox.innerHTML=`<div class="card center"><h2>${t==='rps'?'猜拳':'左右猜'}</h2>${t==='rps'?'<button class="big" data-rps="0">✊</button><button class="big" data-rps="1">✌️</button><button class="big" data-rps="2">✋</button>':'<button class="big" data-lr="0">👈 左</button><button class="big" data-lr="1">右 👉</button>'}<h3 id="gmsg"></h3></div>`}}
function spin(){let rewards=[20,40,60,80,100,20],i=Math.floor(Math.random()*6),deg=1440+(360-i*60);wheel.style.transform=`rotate(${deg}deg)`;spin.disabled=true;setTimeout(()=>{S.coins+=rewards[i];save();gmsg.textContent=`獲得 ${rewards[i]} 金幣！`;localStorage.setItem('eq38wheel',new Date().toDateString());spin.textContent='今天已抽過'},2200)}
document.addEventListener('click',e=>{let b=e.target.closest('button,[data-fi]');if(!b)return;if(b.dataset.go)go(b.dataset.go);if(b.dataset.topic!==undefined)startQuiz(+b.dataset.topic);if(b.dataset.answer!==undefined)answer(+b.dataset.answer);if(b.id==='nextQ'){quiz.at++;quiz.at>=10?finish():showQ()}if(b.id==='retry')startQuiz(quiz.topic);if(b.dataset.wtab){wtab=b.dataset.wtab;renderWard()}if(b.dataset.wval){S.avatar[wtab]=b.dataset.wval;save();renderWard();renderHome()}if(b.dataset.add)addFurniture(b.dataset.add);if(b.dataset.fi!==undefined){selected=+b.dataset.fi;renderRoom()}if(b.id==='larger'&&selected!==null){S.room[selected].s=Math.min(1.8,S.room[selected].s+.15);save();renderRoom()}if(b.id==='smaller'&&selected!==null){S.room[selected].s=Math.max(.5,S.room[selected].s-.15);save();renderRoom()}if(b.id==='flip'&&selected!==null){S.room[selected].flip*=-1;save();renderRoom()}if(b.dataset.pet)petAct(b.dataset.pet);if(b.dataset.game)game(b.dataset.game);if(b.id==='spin')spin();if(b.id==='spellSubmit')checkSpell();if(b.id==='spellHint')spellHint();if(b.id==='spellNext')nextSpell();if(b.dataset.rps!==undefined){let x=+b.dataset.rps,c=Math.floor(Math.random()*3),win=(x-c+3)%3===2;gmsg.textContent=x===c?'平手':win?'你贏了！+10 金幣':'這次輸了';if(win){S.coins+=10;save()}}if(b.dataset.lr!==undefined){let ok=+b.dataset.lr===Math.floor(Math.random()*2);gmsg.textContent=ok?'猜對了！+10 金幣':'猜錯了';if(ok){S.coins+=10;save()}}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.getElementById('spellInput')&&!document.getElementById('spellInput').disabled)checkSpell()});let drag=null;roomStage.addEventListener('pointerdown',e=>{let f=e.target.closest('.furn');if(!f)return;selected=+f.dataset.fi;let r=roomStage.getBoundingClientRect();drag={i:selected,dx:e.clientX-r.left-S.room[selected].x,dy:e.clientY-r.top-S.room[selected].y};f.setPointerCapture(e.pointerId);renderRoom()});roomStage.addEventListener('pointermove',e=>{if(!drag)return;let r=roomStage.getBoundingClientRect(),f=S.room[drag.i];f.x=Math.max(0,Math.min(r.width-80,e.clientX-r.left-drag.dx));f.y=Math.max(0,Math.min(r.height-80,e.clientY-r.top-drag.dy));renderRoom()});roomStage.addEventListener('pointerup',()=>{if(drag){save();drag=null}});save();renderHome();
</script></body></html>
