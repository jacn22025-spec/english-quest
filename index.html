const weapons=[{id:'wood',name:'練習木劍',icon:'🪵',atk:10,coin:0,gem:0,lv:1},{id:'star',name:'星星魔杖',icon:'🪄',atk:16,coin:180,gem:0,lv:2},{id:'sakura',name:'櫻花劍',icon:'🌸',atk:24,coin:420,gem:1,lv:3},{id:'moon',name:'月光法杖',icon:'🌙',atk:34,coin:650,gem:3,lv:5},{id:'crystal',name:'水晶聖劍',icon:'💎',atk:48,coin:900,gem:6,lv:7}];
const monsters=[{id:'slime',name:'果凍史萊姆',icon:'🟢',hp:35,exp:28,coin:25,lv:1},{id:'mush',name:'森林菇菇',icon:'🍄',hp:55,exp:40,coin:35,lv:2},{id:'cloud',name:'雲朵怪',icon:'☁️',hp:75,exp:55,coin:48,lv:3},{id:'ghost',name:'小幽靈',icon:'👻',hp:95,exp:70,coin:60,lv:4},{id:'dragon',name:'星夜小龍',icon:'🐲',hp:130,exp:100,coin:85,lv:5},{id:'boss',name:'月影龍王',icon:'🐉',hp:210,exp:180,coin:150,lv:6,boss:true}];let battle=null;
function shop(){gamebox.innerHTML=`<div class="card"><h2>⚔️ 武器商店</h2><p>目前裝備：${(weapons.find(w=>w.id===S.weapon)||weapons[0]).name}</p><div class="shopgrid">${weapons.map(w=>{let own=S.ownedWeapons.includes(w.id),can=S.level>=w.lv;return `<div class="shopitem"><div class="ico">${weaponArt(w.id)}</div><b>${w.name}</b><p>ATK ${w.atk} · Lv.${w.lv}</p><small>${w.coin?`🪙${w.coin} `:''}${w.gem?`💎${w.gem}`:''}</small><br><button data-buyweapon="${w.id}" ${!can?'disabled':''}>${own?(S.weapon===w.id?'裝備中':'裝備'):can?'購買':'等級不足'}</button></div>`}).join('')}</div></div>`}
function buyWeapon(id){let w=weapons.find(x=>x.id===id);if(!w)return;if(S.ownedWeapons.includes(id)){S.weapon=id;save();shop();return}if(S.level<w.lv)return;if(S.coins<w.coin||S.gems<w.gem){(document.getElementById('gmsg')||{}).textContent='金幣或鑽石不足';return}S.coins-=w.coin;S.gems-=w.gem;S.ownedWeapons.push(id);S.weapon=id;save();shop()}
function startBattle(){let unlocked=monsters.filter(m=>m.lv<=S.level&&(!m.boss||S.level>=6));let normal=unlocked.filter(m=>!m.boss),m=(S.level>=6&&Math.random()<.18)?unlocked.find(m=>m.boss):normal[Math.floor(Math.random()*normal.length)];battle={m:{...m},hp:m.hp,maxhp:m.hp,playerHp:3,q:null,locked:false};renderBattle()}
function battleQuestion(){let pool=spellWords,q=pool[Math.floor(Math.random()*pool.length)],others=pool.filter(x=>x[1]!==q[1]).sort(()=>Math.random()-.5).slice(0,3).map(x=>x[1]),opts=[q[1],...others].sort(()=>Math.random()-.5);battle.q={zh:q[0],ans:q[1],opts};battle.locked=false}
function renderBattle(){if(!battle)startBattle();if(!battle.q)battleQuestion();let w=weapons.find(x=>x.id===S.weapon)||weapons[0];gamebox.innerHTML=`<div class="card"><h2>👾 英文怪獸戰</h2><div class="battleArena ${battle.m.boss?'bossArena':'forestArena'}"><div class="battleSky"><i></i><i></i><i></i></div><div class="${battle.m.boss?'bossTag':'badge'}">${battle.m.boss?'BOSS · ':''}${battle.m.name}</div><div class="monster">${monsterArt(battle.m.id)}</div><div>怪獸 HP ${battle.hp}/${battle.maxhp}</div><div class="hpbar"><i style="width:${battle.hp/battle.maxhp*100}%"></i></div><div class="weaponIcon">${weaponArt(w.id)}</div><small>${w.name} · ATK ${w.atk}</small></div><div class="battleQ"><b>「${battle.q.zh}」的英文是？</b>${battle.q.opts.map(x=>`<button class="answer" data-battleans="${x.replace(/"/g,'&quot;')}">${x}</button>`).join('')}<h3 id="gmsg"></h3></div></div>`}
function battleAnswer(ans){if(!battle||battle.locked)return;battle.locked=true;let w=weapons.find(x=>x.id===S.weapon)||weapons[0];if(ans===battle.q.ans){battle.hp=Math.max(0,battle.hp-w.atk);addXP(5);if(battle.hp<=0){let gem=battle.m.boss?2:(Math.random()<.22?1:0);S.coins+=battle.m.coin;S.gems+=gem;S.monsterDex[battle.m.id]=(S.monsterDex[battle.m.id]||0)+1;if(battle.m.boss)S.bossWins++;let up=addXP(battle.m.exp);save();gamebox.innerHTML=`<div class="card center"><h1>勝利！</h1><div class="monster">${monsterArt(battle.m.id)}</div><p>獲得 🪙 ${battle.m.coin} · EXP ${battle.m.exp}${gem?' · 💎 '+gem:''}</p>${up?'<h2>LEVEL UP!</h2>':''}<button class="big" data-game="battle">再挑戰</button></div>`;battle=null;return}battle.q=null;setTimeout(renderBattle,250)}else{S.wrongWords[battle.q.ans]=(S.wrongWords[battle.q.ans]||0)+1;S.hearts=Math.max(0,S.hearts-1);if(S.hearts===0){if(S.level>1)S.level--;S.xp=0;S.hearts=3;save();gamebox.innerHTML=`<div class="card center"><h1>挑戰失敗</h1><p>❤️ 全部失去，等級下降一階。</p><p>目前 Lv.${S.level} · ❤️❤️❤️</p><button class="big" data-game="battle">重新挑戰</button></div>`;battle=null;return}save();gamebox.innerHTML=`<div class="card center"><h2>答錯了</h2><p>正確答案：<b>${battle.q.ans}</b></p><p>失去 ❤️ 1　目前 ${'❤️'.repeat(S.hearts)}${'♡'.repeat(3-S.hearts)}</p><button class="big" id="battleContinue">繼續戰鬥</button></div>`}}
function monsterDex(){gamebox.innerHTML=`<div class="card"><h2>📖 怪獸圖鑑</h2><p>打倒怪獸後就會登錄。已發現 ${Object.keys(S.monsterDex).length}/${monsters.length}</p><div class="dexgrid">${monsters.map(m=>{let seen=S.monsterDex[m.id];return `<div class="dexitem ${seen?'':'locked'}"><div class="dexmonster">${seen?monsterArt(m.id):'<div style="font-size:48px">?</div>'}</div><b>${seen?m.name:'？？？'}</b><p>${seen?`擊敗 ${seen} 次 · Lv.${m.lv}`:'尚未發現'}</p>${m.boss?'<span class="bossTag">BOSS</span>':''}</div>`}).join('')}</div></div>`}
const gemItems=[{id:'heart',name:'愛心護符',icon:'💗',gem:2,desc:'立即補滿 3 顆愛心'},{id:'xp',name:'星光經驗瓶',icon:'✨',gem:2,desc:'立即獲得 60 EXP'},{id:'coin',name:'金幣寶箱',icon:'🎁',gem:1,desc:'獲得 120 金幣'}];
function gemShop(){gamebox.innerHTML=`<div class="card"><h2>💎 鑽石商店</h2><p>目前持有 💎 ${S.gems}。鑽石可由 Boss、怪獸掉落與特殊獎勵取得。</p><div class="shopgrid">${gemItems.map(x=>`<div class="gemcard"><div class="ico">${x.icon}</div><b>${x.name}</b><p>${x.desc}</p><button data-gembuy="${x.id}">💎 ${x.gem}　兌換</button></div>`).join('')}</div></div>`}
function buyGemItem(id){let x=gemItems.find(i=>i.id===id);if(!x||S.gems<x.gem)return;S.gems-=x.gem;if(id==='heart')S.hearts=3;if(id==='xp')addXP(60);if(id==='coin')S.coins+=120;save();gemShop()}
function profile(){let w=weapons.find(x=>x.id===S.weapon)||weapons[0],known=Object.keys(S.wordMastery).length,mastered=Object.values(S.wordMastery).filter(v=>v>=3).length,wrong=Object.keys(S.wrongWords).length,defeated=Object.values(S.monsterDex).reduce((a,b)=>a+b,0),n=xpNeed();gamebox.innerHTML=`<div class="card"><h2>角色冒險手冊 <span class="versionNote">v56</span></h2><div class="profileHero"><div class="profileAvatar">${avatarSVG()}</div><div><h2>Lv.${S.level}</h2><div class="xptrack"><i style="width:${Math.min(100,S.xp/n*100)}%"></i></div><small>EXP ${S.xp} / ${n}</small><div class="statline"><span>生命</span><b>${'❤️'.repeat(S.hearts)}${'♡'.repeat(3-S.hearts)}</b></div><div class="statline"><span>金幣</span><b>🪙 ${S.coins}</b></div><div class="statline"><span>鑽石</span><b>💎 ${S.gems}</b></div></div></div><h3>目前裝備</h3><div class="profileTile">${weaponArt(w.id)}<b>${w.name}</b><p>ATK ${w.atk}</p></div><h3>冒險紀錄</h3><div class="profileGrid"><div class="profileTile"><b>${defeated}</b><small>擊敗怪獸</small></div><div class="profileTile"><b>${S.bossWins}</b><small>Boss 勝利</small></div><div class="profileTile"><b>${known}</b><small>練習單字</small></div><div class="profileTile"><b>${mastered}</b><small>熟練單字</small></div></div><h3>單字熟練度</h3><p>答對拼字會提高熟練度；累積 3 次視為熟練。</p><div class="masterBar"><i style="width:${known?Math.min(100,mastered/known*100):0}%"></i></div><p>待複習錯字：${wrong} 個</p></div>`}
function game(t){if(t==='profile'){profile()}else if(t==='wheel'){let used=localStorage.getItem('eq56wheel')===new Date().toDateString();gamebox.innerHTML=`<div class="card center"><h2>每日幸運轉盤 <small style="font-size:11px;color:#b58b96">v55</small></h2><div class="wheelWrap"><div class="pointer">▼</div><div class="wheel" id="wheel"><div class="wheelLabels">${[20,40,60,80,100,20].map((v,i)=>`<span style="transform:rotate(${i*60+30}deg) translate(72px,-10px) rotate(-${i*60+30}deg)">${v}</span>`).join('')}</div></div></div><p>指針停在哪一格，就獲得該格金幣。</p><button class="big" id="spin" ${used?'disabled':''}>${used?'今天已抽過':'開始轉動'}</button><h3 id="gmsg"></h3></div>`}else if(t==='shop'){shop()}else if(t==='dex'){monsterDex()}else if(t==='gemshop'){gemShop()}else if(t==='battle'){startBattle()}else if(t==='spell'){spellState={index:-1,last:spellState.last,correct:0,total:0,answer:'',combo:0};nextSpell()}else{gamebox.innerHTML=`<div class="card center"><h2>${t==='rps'?'猜拳':'左右猜'}</h2>${t==='rps'?'<button class="big" data-rps="0">✊</button><button class="big" data-rps="1">✌️</button><button class="big" data-rps="2">✋</button>':'<button class="big" data-lr="0">👈 左</button><button class="big" data-lr="1">右 👉</button>'}<h3 id="gmsg"></h3></div>`}}
function spin(){let rewards=[20,40,60,80,100,20],i=Math.floor(Math.random()*6),center=i*60+30,deg=1800-center;wheel.style.transform=`rotate(${deg}deg)`;spin.disabled=true;setTimeout(()=>{S.coins+=rewards[i];save();gmsg.textContent=`指針停在 ${rewards[i]}：獲得 ${rewards[i]} 金幣！`;localStorage.setItem('eq56wheel',new Date().toDateString());spin.textContent='今天已抽過'},2200)}
document.addEventListener('click',e=>{let b=e.target.closest('button,[data-fi]');if(!b)return;if(b.dataset.go)go(b.dataset.go);if(b.dataset.topic!==undefined)startQuiz(+b.dataset.topic);if(b.dataset.answer!==undefined)answer(+b.dataset.answer);if(b.id==='nextQ'){quiz.at++;quiz.at>=10?finish():showQ()}if(b.id==='retry')startQuiz(quiz.topic);if(b.dataset.wtab){wtab=b.dataset.wtab;renderWard()}if(b.dataset.wval){S.avatar[wtab]=b.dataset.wval;save();renderWard();renderHome()}if(b.dataset.add)addFurniture(b.dataset.add);if(b.dataset.fi!==undefined){selected=+b.dataset.fi;renderRoom()}if(b.id==='larger'&&selected!==null){S.room[selected].s=Math.min(1.8,S.room[selected].s+.15);save();renderRoom()}if(b.id==='smaller'&&selected!==null){S.room[selected].s=Math.max(.5,S.room[selected].s-.15);save();renderRoom()}if(b.id==='flip'&&selected!==null){S.room[selected].flip*=-1;save();renderRoom()}if(b.dataset.pet)petAct(b.dataset.pet);if(b.dataset.game)game(b.dataset.game);if(b.dataset.buyweapon)buyWeapon(b.dataset.buyweapon);if(b.dataset.gembuy)buyGemItem(b.dataset.gembuy);if(b.dataset.battleans!==undefined)battleAnswer(b.dataset.battleans);if(b.id==='battleContinue'){battle.q=null;renderBattle();}if(b.id==='spin')spin();if(b.id==='spellSubmit')checkSpell();if(b.id==='spellHint')spellHint();if(b.id==='spellNext')nextSpell();if(b.dataset.rps!==undefined){let x=+b.dataset.rps,c=Math.floor(Math.random()*3),win=(x-c+3)%3===2;gmsg.textContent=x===c?'平手':win?'你贏了！+10 金幣':'這次輸了';if(win){S.coins+=10;save()}}if(b.dataset.lr!==undefined){let ok=+b.dataset.lr===Math.floor(Math.random()*2);gmsg.textContent=ok?'猜對了！+10 金幣':'猜錯了';if(ok){S.coins+=10;save()}}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.getElementById('spellInput')&&!document.getElementById('spellInput').disabled)checkSpell()});let drag=null;roomStage.addEventListener('pointerdown',e=>{let f=e.target.closest('.furn');if(!f)return;selected=+f.dataset.fi;let r=roomStage.getBoundingClientRect();drag={i:selected,dx:e.clientX-r.left-S.room[selected].x,dy:e.clientY-r.top-S.room[selected].y};f.setPointerCapture(e.pointerId);renderRoom()});roomStage.addEventListener('pointermove',e=>{if(!drag)return;let r=roomStage.getBoundingClientRect(),f=S.room[drag.i];f.x=Math.max(0,Math.min(r.width-80,e.clientX-r.left-drag.dx));f.y=Math.max(0,Math.min(r.height-80,e.clientY-r.top-drag.dy));renderRoom()});roomStage.addEventListener('pointerup',()=>{if(drag){save();drag=null}});save();renderHome();
</script></body></html>
