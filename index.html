function renderAvatar(){if(window.wardAvatar)wardAvatar.innerHTML=avatarSVG();if(window.homeAvatar)homeAvatar.innerHTML=avatarSVG();if(window.homePet)homePet.innerHTML=dogSVG("dog") }
function go(id){document.querySelectorAll(".page").forEach(x=>x.classList.remove("on"));document.getElementById(id).classList.add("on");if(id==="map")renderMap();if(id==="wardrobe")renderWard();if(id==="pet")renderPet();scrollTo(0,0)}
function renderMap(){nodes.innerHTML=topics.map((t,i)=>{let p=S.progress[i]||{star:1,clears:0};return `<button class="node" data-topic="${i}"><b>${i+1}. ${t[0]}</b><span class="stars">${"★".repeat(p.star)}${"☆".repeat(3-p.star)}</span><small> 熟練 ${p.clears}/6</small></button>`}).join("")}
let quiz=null;
function makeQuiz(i){let key=topics[i][1],pool=B[key],recent=S.recent[key]||[];let ids=[...pool.keys()].filter(x=>!recent.includes(x));if(ids.length<5)ids=[...pool.keys()];ids.sort(()=>Math.random()-.5);let out=[];for(let n=0;n<10;n++){let id=ids[n%ids.length],q=pool[id],opts=q[1].map((x,j)=>[x,j===q[2]]).sort(()=>Math.random()-.5);out.push({text:q[0],opts,id})}S.recent[key]=out.slice(-5).map(x=>x.id);save();return out}
function startQuiz(i){quiz={topic:i,qs:makeQuiz(i),at:0,score:0,locked:false};go("quiz");showQ()}
function showQ(){let q=quiz.qs[quiz.at];qtitle.textContent=topics[quiz.topic][0]+`　${quiz.at+1}/10`;qbar.style.width=((quiz.at+1)*10)+"%";qtext.textContent=q.text;answers.innerHTML=q.opts.map((o,j)=>`<button class="answer" data-answer="${j}">${String.fromCharCode(65+j)}　${o[0]}</button>`).join("");feedback.textContent="";next.classList.add("hidden");quiz.locked=false}
function answer(j){if(quiz.locked)return;quiz.locked=true;let q=quiz.qs[quiz.at],ok=q.opts[j][1];if(ok)quiz.score++;[...answers.children].forEach((b,k)=>{if(q.opts[k][1])b.classList.add("good");else if(k==j)b.classList.add("bad")});feedback.textContent=ok?"答對了！":"再看一次正確答案。";next.classList.remove("hidden")}
function finish(){let ok=quiz.score>=7,p=S.progress[quiz.topic]||{star:1,clears:0};if(ok){p.clears++;S.coins+=50;if(p.clears>=6&&p.star<3){p.star++;p.clears=0;S.gems++}}S.progress[quiz.topic]=p;save();score.textContent=quiz.score+"/10";pass.textContent=ok?"通過 ✓":"未通過，再練一次";reward.textContent=ok?"獲得 🪙 50"+(p.clears===0&&p.star>1?"　升星！":""):"7 題以上即可過關";go("result")}
const ward={hair:[["長波浪","wave"],["短髮","short"],["包頭","bun"],["鮑伯","bob"]],color:[["奶茶棕","#70483c"],["莓果棕","#6c3943"],["蜂蜜金","#b9854d"],["霧粉棕","#9a6b72"]],dress:[["櫻花粉","#f5a7c2"],["天空藍","#91c9e8"],["奶茶","#d7b18a"],["森林綠","#8db99b"]],acc:[["小包","bag"],["蝴蝶結","bow"],["無配件","none"]]};
let wtab="hair";function renderWard(){wtabs.innerHTML=[["hair","髮型"],["color","髮色"],["dress","服裝"],["acc","配件"]].map(x=>`<button class="tab ${wtab===x[0]?"sel":""}" data-wtab="${x[0]}">${x[1]}</button>`).join("");wchoices.innerHTML=ward[wtab].map(x=>`<button class="choice ${S.avatar[wtab]===x[1]?"active":""}" data-wval="${x[1]}">${x[0]}</button>`).join("");renderAvatar()}
function renderPet(){petBig.innerHTML=dogSVG();hunger.textContent=S.pet.hunger;hbar.style.width=S.pet.hunger+"%"}
function petAct(x){if(x==="feed"){if(S.coins>=10){S.coins-=10;S.pet.hunger=Math.min(100,S.pet.hunger+20);petmsg.textContent="吃飽了！"}}if(x==="rest"){S.pet.hunger=Math.min(100,S.pet.hunger+5);petmsg.textContent="休息完成。"}if(x==="work"){S.coins+=20;S.pet.hunger=Math.max(0,S.pet.hunger-10);petmsg.textContent="工作完成，獲得 20 金幣。"}save();renderPet()}
const spellWords=[["蘋果","apple"],["學校","school"],["朋友","friend"],["早餐","breakfast"],["圖書館","library"],["漂亮的","beautiful"],["星期三","Wednesday"],["因為","because"]];
function game(type){if(type==="rps")gamebox.innerHTML=`<div class="card center"><h2>猜拳</h2><button class="big" data-rps="0">✊ 石頭</button> <button class="big" data-rps="1">✌️ 剪刀</button> <button class="big" data-rps="2">✋ 布</button><h3 id="gmsg"></h3></div>`;if(type==="lr")gamebox.innerHTML=`<div class="card center"><h2>左右猜</h2><p>猜金幣藏在哪一邊</p><button class="big" data-lr="0">👈 左</button> <button class="big" data-lr="1">右 👉</button><h3 id="gmsg"></h3></div>`;if(type==="wheel"){let used=localStorage.getItem("eq35wheel")===new Date().toDateString();gamebox.innerHTML=`<div class="card center"><img class="gameArt" src="assets/wheel.jpg" alt="幸運轉盤插畫"><h2>幸運轉盤</h2><div class="wheel" id="wheel"></div><button class="big" id="spin" ${used?"disabled":""}>${used?"今天已抽過":"開始轉動"}</button><h3 id="gmsg"></h3></div>`}if(type==="spell"){let w=spellWords[Math.floor(Math.random()*spellWords.length)];gamebox.innerHTML=`<div class="card center"><img class="gameArt" src="assets/spell.jpg" alt="單字拼字插畫"><h2>單字拼字</h2><h1>${w[0]}</h1><input id="spellInput" autocomplete="off" autocapitalize="none"><br><br><button class="big" data-spell="${w[1]}">送出</button> <button class="big" data-hint="${w[1]}">提示 -10 🪙</button><h3 id="gmsg"></h3></div>`}}
function rps(x){let cpu=Math.floor(Math.random()*3),names=["石頭","剪刀","布"],win=(x===0&&cpu===1)||(x===1&&cpu===2)||(x===2&&cpu===0);gmsg.textContent=x===cpu?`平手，都是${names[x]}`:win?`你贏了！對手出${names[cpu]}`:`這次輸了，對手出${names[cpu]}`;if(win){S.coins+=10;save()}}
function lr(x){let a=Math.floor(Math.random()*2);gmsg.textContent=x===a?"猜對了！+10 金幣":"猜錯了，再試一次";if(x===a){S.coins+=10;save()}}
function spinWheel(){if(localStorage.getItem("eq35wheel")===new Date().toDateString())return;let rewards=[20,40,60,80,100,20],i=Math.floor(Math.random()*6);wheel.style.transform=`rotate(${1440+i*60}deg)`;setTimeout(()=>{S.coins+=rewards[i];save();gmsg.textContent=`獲得 ${rewards[i]} 金幣！`;spin.disabled=true;spin.textContent="今天已抽過";localStorage.setItem("eq35wheel",new Date().toDateString())},2300)}
function furnHTML(x,i){let shape=x.type==="desk"?'<div class="deskShape"><i></i></div>':x.type==="sofa"?'<div class="sofaShape"></div>':'<div class="lampShape"></div>';return `<div class="furn ${selectedFurn===i?'selected':''}" data-fi="${i}" style="left:${x.x}px;top:${x.y}px;transform:scale(${x.scale||1})">${shape}</div>`}
function room(){furniture.innerHTML=S.room.map(furnHTML).join("")}
function addFurn(type){S.room.push({type,x:45+S.room.length*18,y:190+(S.room.length%2)*55,scale:1});selectedFurn=S.room.length-1;save();room()}
function scaleFurn(dir){if(selectedFurn===null||!S.room[selectedFurn])return;let f=S.room[selectedFurn];f.scale=Math.max(.55,Math.min(1.8,(f.scale||1)+(dir==="up"?.15:-.15)));save();room()}
let drag=null;roomStage.addEventListener('pointerdown',e=>{let el=e.target.closest('.furn');if(!el)return;e.preventDefault();selectedFurn=+el.dataset.fi;let f=S.room[selectedFurn];drag={id:e.pointerId,dx:e.clientX-f.x,dy:e.clientY-f.y};el.setPointerCapture?.(e.pointerId);room()});
roomStage.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId||selectedFurn===null)return;e.preventDefault();let r=roomStage.getBoundingClientRect(),f=S.room[selectedFurn];f.x=Math.max(0,Math.min(r.width-55,e.clientX-r.left-drag.dx));f.y=Math.max(0,Math.min(r.height-55,e.clientY-r.top-drag.dy));room()});
function endDrag(e){if(drag){drag=null;save()}}roomStage.addEventListener('pointerup',endDrag);roomStage.addEventListener('pointercancel',endDrag);
document.addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.go)go(b.dataset.go);if(b.dataset.topic!==undefined)startQuiz(+b.dataset.topic);if(b.dataset.answer!==undefined)answer(+b.dataset.answer);if(b.id==="next"){quiz.at++;quiz.at>=10?finish():showQ()}if(b.id==="again")startQuiz(quiz.topic);if(b.dataset.wtab){wtab=b.dataset.wtab;renderWard()}if(b.dataset.wval){S.avatar[wtab]=b.dataset.wval;save();renderWard();renderAvatar()}if(b.dataset.pet)petAct(b.dataset.pet);if(b.dataset.game)game(b.dataset.game);if(b.dataset.rps!==undefined)rps(+b.dataset.rps);if(b.dataset.lr!==undefined)lr(+b.dataset.lr);if(b.id==="spin")spinWheel();if(b.dataset.spell){gmsg.textContent=spellInput.value.trim().toLowerCase()===b.dataset.spell.toLowerCase()?"答對了！+10 金幣":"再試一次";if(spellInput.value.trim().toLowerCase()===b.dataset.spell.toLowerCase()){S.coins+=10;save()}}if(b.dataset.hint){if(S.coins>=10){S.coins-=10;save();gmsg.textContent=`提示：${b.dataset.hint[0]} _ _ _`}}if(b.dataset.furn)addFurn(b.dataset.furn);if(b.dataset.roomScale)scaleFurn(b.dataset.roomScale);if(b.id==="deleteFurn"&&selectedFurn!==null){S.room.splice(selectedFurn,1);selectedFurn=null;save();room()}if(b.id==="resetRoom"){S.room=[];selectedFurn=null;save();room()}})
stats();renderAvatar();room();renderPet();
</script></body></html>
